AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploys the complete, hardened Vaxelrod AI System including ECR, S3 (with SSE), SQS (with DLQ), IAM Roles, and Lambda Functions.'

Parameters:
  RecipientEmailAddress:
    Type: String
    Description: 'The email address where quotes will be sent. You must verify this address in SES.'

Resources:
  # === ECR Repositories for Docker Images ===
  QuoterECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vaxelrod-quoter
      ImageScanningConfiguration:
        ScanOnPush: true

  ScraperECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vaxelrod-scraper
      ImageScanningConfiguration:
        ScanOnPush: true

  # === S3 Bucket for Product Data (with Server-Side Encryption) ===
  ProductDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'vaxelrod-product-data-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # === SQS Dead Letter Queue (DLQ) ===
  MicropurchaseDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: micropurchase-opportunities-dlq
      MessageRetentionPeriod: 1209600 # 14 days

  # === SQS Main Queue (with Redrive Policy to DLQ) ===
  MicropurchaseQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: micropurchase-opportunities-queue
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MicropurchaseDLQ.Arn
        maxReceiveCount: 5

  # === IAM Role for Lambda Functions ===
  VaxelrodLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Vaxelrod-Lambda-Execution-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Vaxelrod-Core-Permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:Vaxelrod-Gemini-API-Key-prod-*' # Wildcard for suffix
              - Effect: Allow
                Action: "s3:GetObject"
                Resource: !Sub '${ProductDataBucket.Arn}/*'
              - Effect: Allow
                Action: "ses:SendEmail"
                Resource: "*"
              - Effect: Allow
                Action: ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes", "sqs:SendMessage"]
                Resource: !GetAtt MicropurchaseQueue.Arn

  # === Lambda Function: Scraper ===
  ScraperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: vaxelrod-scraper
      PackageType: Image
      Role: !GetAtt VaxelrodLambdaRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref MicropurchaseQueue
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vaxelrod-scraper:latest'

  # === Lambda Function: Quoter (Hardened) ===
  QuoterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: vaxelrod-quoter
      PackageType: Image
      Role: !GetAtt VaxelrodLambdaRole.Arn
      Timeout: 60 # Increased timeout
      MemorySize: 1024 # Increased memory
      Environment:
        Variables:
          GEMINI_API_KEY_SECRET_NAME: 'Vaxelrod-Gemini-API-Key-prod'
          GEMINI_MODEL: 'gemini-2.5-flash' # Explicitly set model
          S3_BUCKET_NAME: !Ref ProductDataBucket
          PRODUCT_CATALOG_KEY: 'products.csv'
          SENDER_EMAIL: !Ref RecipientEmailAddress
          RECIPIENT_EMAIL: !Ref RecipientEmailAddress
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vaxelrod-quoter:latest'

  # === SQS to Quoter Event Source Mapping (with Partial Batch Failure support) ===
  QuoterEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt MicropurchaseQueue.Arn
      FunctionName: !GetAtt QuoterFunction.Arn
      Enabled: true
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 2
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # === EventBridge Schedule for Scraper ===
  ScraperScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: "Run scraper every 10 minutes"
      ScheduleExpression: "rate(10 minutes)"
      State: "ENABLED"
      Targets:
        - Arn: !GetAtt ScraperFunction.Arn
          Id: "VaxelrodScraperTarget"

  ScraperInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ScraperFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt ScraperScheduleRule.Arn

